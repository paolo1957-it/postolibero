<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PostoLibero</title>
  <meta name="description" content="Posti auto e parcheggi liberi entro 1 km dalla tua posizione">
  <meta name="theme-color" content="#1b4f9c">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand" aria-label="PostoLibero">
        <span class="p-sign" aria-hidden="true">P</span>
        <span class="brand-name">PostoLibero</span>
      </div>
      <form class="cerca" id="form-cerca" role="search">
        <label for="cerca-indirizzo" class="sr-only">Cerca un indirizzo</label>
        <input id="cerca-indirizzo" type="search" placeholder="Cerca un indirizzo…" autocomplete="off" enterkeyhint="search">
      </form>
      <label class="raggio">
        <span class="sr-only">Raggio</span>
        <select id="raggio">
          <option value="200">200 m</option>
          <option value="500">500 m</option>
          <option value="1000" selected>1 km</option>
          <option value="2000">2 km</option>
        </select>
      </label>
    </header>

    <main class="corpo">
      <div id="mappa" class="mappa" role="application" aria-label="Mappa dei parcheggi"></div>
      <div class="filigrana" id="filigrana" aria-hidden="true"><span id="filigrana-testo">Versione</span></div>

      <div class="fab-col">
        <button class="fab" id="btn-centra" type="button" title="Torna alla mia posizione" aria-label="Torna alla mia posizione">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="currentColor"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="12" r="7.5" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        </button>
        <button class="fab fab-nero" id="btn-elenco" type="button" title="Elenco dei posti vicini" aria-label="Apri l'elenco dei posti vicini" aria-controls="pannello" aria-expanded="false">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><circle cx="4.5" cy="6" r="1.6" fill="currentColor"/><circle cx="4.5" cy="12" r="1.6" fill="currentColor"/><circle cx="4.5" cy="18" r="1.6" fill="currentColor"/></svg>
          <span class="badge" id="badge-elenco" hidden></span>
        </button>
        <button class="fab" id="btn-aggiorna" type="button" title="Aggiorna" aria-label="Aggiorna i dati">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>

      <div class="fab-azioni">
        <button class="fab fab-verde" id="btn-libero" type="button" title="Segnala un posto libero qui" aria-label="Segnala un posto libero dove ti trovi">
          <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 6.5v7M8.5 10h7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        </button>
        <button class="fab fab-rosso" id="btn-parcheggiato" type="button" title="Ho parcheggiato qui" aria-label="Ho parcheggiato qui: segna il posto come occupato">
          <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path d="M5 16.5V12l1.8-4.6A2 2 0 0 1 8.7 6h6.6a2 2 0 0 1 1.9 1.4L19 12v4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M4 12.2h16v4.3H4z" fill="currentColor"/><path d="M6.5 16.5v2M17.5 16.5v2" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><circle cx="7.5" cy="14.3" r="1.1" fill="var(--rosso-icona)"/><circle cx="16.5" cy="14.3" r="1.1" fill="var(--rosso-icona)"/></svg>
        </button>
      </div>
    </main>

    <section class="pannello" id="pannello" aria-label="Posti vicini" hidden>
      <header class="pannello-testa">
        <h2>Posti vicini</h2>
        <button class="chiudi" id="btn-chiudi" type="button" aria-label="Chiudi l'elenco e torna alla mappa">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        </button>
      </header>

      <div class="pannello-corpo">
        <div class="stato" id="stato" role="status" aria-live="polite">Cerco la tua posizione…</div>

        <label class="auto" for="auto-refresh">
          <span>AUTO-REFRESH</span>
          <select id="auto-refresh">
            <option value="0">0 · spento</option>
            <option value="30">30 s</option>
            <option value="60">60 s</option>
            <option value="120" selected>120 s</option>
          </select>
        </label>

        <label class="auto" for="suoni">
          <span>SUONI</span>
          <select id="suoni">
            <option value="1" selected>Attivi</option>
            <option value="0">Spenti</option>
          </select>
        </label>

        <div class="sommario" id="sommario">
          <div class="kpi kpi-reale"><b id="k-reale">–</b><span>liberi ora<br>in parcheggi</span></div>
          <div class="kpi kpi-segn"><b id="k-segn">–</b><span>posti segnalati<br>liberi</span></div>
          <div class="kpi kpi-osm"><b id="k-osm">–</b><span>aree di sosta<br>in zona</span></div>
        </div>

        <div class="filtri" role="group" aria-label="Filtri">
          <button class="chip" type="button" data-filtro="gratuito" aria-pressed="false">Gratuiti</button>
          <button class="chip" type="button" data-filtro="disabili" aria-pressed="false">Disabili</button>
          <button class="chip" type="button" data-filtro="coperto" aria-pressed="false">Coperti</button>
          <button class="chip" type="button" data-filtro="strada" aria-pressed="false">Su strada</button>
        </div>

        <ol class="lista" id="lista"></ol>

        <footer class="fonti">
          Dati: © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>
          <span id="fonti-extra"></span>.
          Le aree di sosta OSM indicano dove si può parcheggiare, non se c'è posto in questo momento.
        </footer>
      </div>
    </section>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="config.js"></script>
  <script src="core.js"></script>
  <script src="segnalazioni.js"></script>
  <script src="app.js"></script>
</body>
</html>
