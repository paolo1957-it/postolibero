name: Pubblica sito e aggiorna parcheggi

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"   # ogni lunedì alle 3:17 (ora UTC) scarica i parcheggi
  workflow_dispatch:         # pulsante "Run workflow" per farlo partire a mano

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pubblica:
    runs-on: ubuntu-latest
    env:
      # Notifica sull'iPhone con l'app ntfy: il nome del canale sta nel secret NTFY_TOPIC.
      # Se il secret non c'è, la notifica viene saltata.
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      ESITO: /tmp/esito.txt
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Scarica i parcheggi da OpenStreetMap
        id: parcheggi
        if: github.event_name != 'push'
        continue-on-error: true
        timeout-minutes: 180
        run: python3 aggiorna_parcheggi.py

      - name: Scarica le ZTL della Lombardia
        id: ztl
        if: github.event_name != 'push'
        continue-on-error: true
        timeout-minutes: 20
        run: python3 aggiorna_ztl.py

      - name: Salva i parcheggi nel repository
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -d osm ]; then git add osm; fi
          if [ -f ztl.json ]; then git add ztl.json; fi
          if git diff --cached --quiet; then
            echo "Nessuna novità"
          else
            git commit -m "Aggiornamento parcheggi $(date -u +%Y-%m-%d)"
            git push
          fi

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v5

      # Solo quando si scaricano i parcheggi (il lunedì o col pulsante), non a ogni pubblicazione:
      # ✅ tutte le zone aggiornate · ⚠️ alcune zone o le ZTL non aggiornate · ❌ niente aggiornato o pubblicazione fallita
      - name: Notifica sull'iPhone
        if: always() && env.NTFY_TOPIC != '' && github.event_name != 'push'
        env:
          STATO_JOB: ${{ job.status }}
          STATO_PARCHEGGI: ${{ steps.parcheggi.outcome }}
          STATO_ZTL: ${{ steps.ztl.outcome }}
          LINK: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          try:
              ok, tot = (int(x) for x in open(os.environ["ESITO"], encoding="utf-8").read().strip().split(";"))
          except Exception:
              ok, tot = 0, 0
          ztl = os.environ["STATO_ZTL"] == "success"
          if os.environ["STATO_JOB"] != "success" or ok == 0:
              msg = ("Aggiornamento fallito", "Parcheggi non aggiornati: restano quelli vecchi. Tocca per vedere cosa è successo su GitHub.", "x", 4)
          elif ok < tot or not ztl:
              parti = [f"Parcheggi aggiornati in {ok} zone su {tot}"]
              if not ztl:
                  parti.append("ZTL non aggiornate")
              msg = ("Aggiornamento parziale", "; ".join(parti) + ".", "warning", 4)
          else:
              msg = ("Parcheggi aggiornati", f"Tutte le {tot} zone e le ZTL sono aggiornate.", "white_check_mark", 3)
          titolo, testo, tag, prio = msg
          corpo = {"topic": os.environ["NTFY_TOPIC"], "title": "PostoLibero: " + titolo,
                   "message": testo, "tags": [tag], "priority": prio, "click": os.environ["LINK"]}
          req = urllib.request.Request("https://ntfy.sh/", data=json.dumps(corpo).encode(),
                                       headers={"Content-Type": "application/json"})
          urllib.request.urlopen(req, timeout=30).read()
          print("Notifica inviata:", titolo, "-", testo)
          PY
